<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Khoản Chi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        /* Optimized animations for 60fps */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -15px, 0); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.5), 
                             0 0 40px rgba(99, 102, 241, 0.3); 
            }
            50% { 
                text-shadow: 0 0 30px rgba(99, 102, 241, 0.7), 
                             0 0 60px rgba(99, 102, 241, 0.4); 
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 30px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        
        body {
            background: linear-gradient(-45deg, #0f0f23, #1a0f2e, #0a1628, #1e1140, #0d1b2a, #1a0b2e);
            background-size: 400% 400%;
            animation: gradient-shift 35s ease infinite;
            color: #e2e8f0 !important;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            /* Optimized for smooth performance */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
            animation: float 45s ease-in-out infinite;
            pointer-events: none;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
            opacity: 0.3;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
        }

        .tech-card {
            background: rgba(30, 41, 59, 0.75) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 
                        0 8px 32px rgba(99, 102, 241, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            will-change: transform, box-shadow;
            transform: translateZ(0);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            /* GPU Acceleration */
            backface-visibility: hidden;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            animation: float 30s ease-in-out infinite;
            pointer-events: none;
        }
        
        .tech-card:hover {
            transform: translate3d(0, -8px, 0);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7), 
                        0 12px 40px rgba(99, 102, 241, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.25),
                        0 0 0 1px rgba(99, 102, 241, 0.5);
        }

        .glow-text {
            color: #ffffff !important;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        .tech-label {
            color: #cbd5e1 !important;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .tech-input-group {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.5) !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
            will-change: border-color, box-shadow;
        }
        .tech-input-group:focus-within {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2) !important;
        }

        .tech-input-text {
            background: transparent !important;
            border: none !important;
            color: #64748b !important;
            padding-left: 14px;
            padding-right: 8px;
        }

        .tech-form-control {
            background: transparent !important;
            border: none !important;
            color: #f8fafc !important;
            padding: 12px 14px 12px 4px;
            box-shadow: none !important;
        }
        .tech-form-control::placeholder {
            color: #475569 !important;
        }
        
        .tech-form-control::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }
        
        .tech-form-control option {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }

        .btn-tech-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4), 0 0 0 1px rgba(99, 102, 241, 0.2) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            will-change: transform;
            transform: translateZ(0);
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        
        .btn-tech-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-tech-primary:hover {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%) !important;
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5), 0 0 0 1px rgba(99, 102, 241, 0.4) !important;
        }
        
        .btn-tech-primary:hover::before {
            left: 100%;
        }
        
        .btn-tech-primary:active {
            transform: translate3d(0, 0, 0);
        }

        .btn-tech-outline {
            background: rgba(30, 41, 59, 0.4) !important;
            color: #94a3b8 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-tech-outline:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #f8fafc !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            transform: translate3d(0, -2px, 0);
        }
        
        /* ===== MOBILE OPTIMIZATIONS (< 768px) ===== */
        @media (max-width: 767.98px) {
            body {
                animation: gradient-shift 40s ease infinite;
                padding: 1rem !important;
            }
            
            body::before {
                animation: float 50s ease-in-out infinite;
            }
            
            .container {
                padding: 0 !important;
            }
            
            .tech-card {
                border-radius: 20px;
                padding: 20px !important;
            }
            
            .tech-card:hover {
                transform: none;
            }
            
            h3 {
                font-size: 1.3rem !important;
            }
            
            .glow-text {
                animation: none;
                text-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            }
            
            .btn-tech-primary, .btn-tech-outline {
                min-height: 48px;
                font-size: 1rem;
                padding: 14px 16px !important;
            }
            
            .tech-input-group {
                min-height: 48px;
            }
            
            .tech-form-control {
                font-size: 16px !important;
                padding: 14px !important;
            }
            
            /* Mobile button layout */
            .row.g-2 {
                gap: 0.5rem !important;
            }
            
            .row.g-2 .col-8,
            .row.g-2 .col-4 {
                width: 100% !important;
                max-width: 100% !important;
            }
            
            button, input, select, textarea {
                touch-action: manipulation;
                -webkit-tap-highlight-color: rgba(99, 102, 241, 0.2);
            }
        }
        
        /* ===== DESKTOP OPTIMIZATIONS (>= 768px) ===== */
        @media (min-width: 768px) {
            .tech-card {
                padding: 32px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                
                <div class="card tech-card border-0 p-3 p-sm-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-white glow-text d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-node-plus text-info"></i> GHI KHOẢN CHI MỚI
                            </h3>
                            <p class="small m-0 mt-1" style="color: #64748b;">Khởi tạo bản ghi tiêu dùng vào cơ sở dữ liệu hệ thống</p>
                        </div>
                        
                        <form th:action="@{/saveExpense}" th:object="${expense}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Nội dung chi tiêu</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-pencil-square"></i></span>
                                    <input type="text" th:field="*{title}" class="form-control tech-form-control" placeholder="Ví dụ: Mua sắm quần áo, Ăn tối..." required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Phân loại danh mục</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-tags"></i></span>
                                    <select th:field="*{category}" class="form-select tech-form-control" style="cursor: pointer;" required>
                                        <option value="" disabled selected hidden>-- Chọn phân loại phù hợp --</option>
                                        <option value="Ăn uống">🍔 Ăn uống</option>
                                        <option value="Di chuyển">🚗 Di chuyển</option>
                                        <option value="Mua sắm">🛍️ Mua sắm</option>
                                        <option value="Giải trí">🎬 Giải trí</option>
                                        <option value="Học tập">📚 Học tập</option>
                                        <option value="Hóa đơn">💵 Hóa đơn & Tiện ích</option>
                                        <option value="Khác">✨ Mục khác</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Số tiền chi tiêu (VND)</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-cash-coin"></i></span>
                                    <input type="number" step="any" th:field="*{amount}" class="form-control tech-form-control" placeholder="Nhập số tiền..." min="0" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label mb-2 tech-label">Thời gian giao dịch</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-calendar-check"></i></span>
                                    <input type="date" th:field="*{date}" class="form-control tech-form-control" required>
                                </div>
                            </div>

                            <div class="row g-2 pt-3">
                                <div class="col-8">
                                    <button type="submit" class="btn btn-tech-primary w-100 py-3 rounded-3 fw-bold">
                                        <i class="bi bi-cloud-arrow-up-fill me-1"></i> Lưu Khoản Chi
                                    </button>
                                </div>
                                <div class="col-4">
                                    <a th:href="@{/}" class="btn btn-tech-outline w-100 py-3 rounded-3 fw-semibold text-center d-block">
                                        Hủy bỏ
                                    </a>
                                </div>
                            </div>
                            
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="/js/premium-effects.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const title = document.querySelector('input[name="title"]').value;
            const amount = document.querySelector('input[name="amount"]').value;
            const category = document.querySelector('select[name="category"]').value;
            
            // Validation
            if (!title || !amount || !category) {
                e.preventDefault();
                PremiumEffects.showToast('Vui lòng điền đầy đủ thông tin!', 'warning');
                return false;
            }
            
            if (parseFloat(amount) <= 0) {
                e.preventDefault();
                PremiumEffects.showToast('Số tiền phải lớn hơn 0!', 'warning');
                return false;
            }
            
            // Show loading and success message
            PremiumEffects.showLoading();
            PremiumEffects.showToast('Đang lưu khoản chi...', 'info');
        });
    </script>
</body>
</html>
