<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Thêm Khoản Chi</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#5a7fa8" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chi Tiêu">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/theme-variables.css" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
    
    <style>
        /* Optimized animations for 60fps */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -15px, 0); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.5), 
                             0 0 40px rgba(99, 102, 241, 0.3); 
            }
            50% { 
                text-shadow: 0 0 30px rgba(99, 102, 241, 0.7), 
                             0 0 60px rgba(99, 102, 241, 0.4); 
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 30px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        
        body {
            background-size: 400% 400%;
            animation: gradient-shift 35s ease infinite;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            /* Optimized for smooth performance */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
            animation: float 45s ease-in-out infinite;
            pointer-events: none;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
            opacity: 0.3;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
        }

        .tech-card {
            background: var(--tech-card-bg) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--tech-card-border) !important;
            border-radius: 24px;
            box-shadow: var(--tech-card-shadow);
            will-change: transform, box-shadow;
            transform: translateZ(0);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease;
            position: relative;
            overflow: hidden;
            backface-visibility: hidden;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            animation: float 30s ease-in-out infinite;
            pointer-events: none;
        }
        
        .tech-card:hover {
            transform: translate3d(0, -6px, 0);
            box-shadow: var(--tech-card-shadow-hover);
        }

        .glow-text {
            color: var(--text-primary) !important;
            -webkit-text-fill-color: var(--text-primary);
        }
        [data-theme="dark"] .glow-text {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        .tech-label {
            color: var(--label-color) !important;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .tech-input-group {
            border: 1px solid var(--input-border) !important;
            border-radius: 12px;
            overflow: hidden;
            background: var(--input-bg) !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
        }
        .tech-input-group:focus-within {
            border-color: var(--input-border-focus) !important;
            box-shadow: 0 0 0 3px var(--input-shadow-focus) !important;
        }

        .tech-input-text {
            background: transparent !important;
            border: none !important;
            color: var(--input-icon-color) !important;
            padding-left: 14px;
            padding-right: 8px;
        }

        .tech-form-control {
            background: transparent !important;
            border: none !important;
            color: var(--input-color) !important;
            padding: 12px 14px 12px 4px;
            box-shadow: none !important;
        }
        .tech-form-control::placeholder {
            color: var(--input-placeholder) !important;
        }
        
        .tech-form-control::-webkit-calendar-picker-indicator {
            filter: var(--calendar-icon-filter, invert(1));
            opacity: 0.5;
            cursor: pointer;
        }
        [data-theme="light"] .tech-form-control::-webkit-calendar-picker-indicator {
            filter: none;
            opacity: 0.5;
        }
        
        .tech-form-control option {
            background-color: var(--dropdown-bg) !important;
            color: var(--input-color) !important;
        }

        .btn-tech-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4f46e5 100%) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 4px 14px rgba(90, 127, 168, 0.3) !important;
            transition: transform 0.25s ease, box-shadow 0.25s ease !important;
            will-change: transform;
            transform: translateZ(0);
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        .btn-tech-primary:hover {
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 6px 20px rgba(90, 127, 168, 0.4) !important;
        }
        .btn-tech-primary:active {
            transform: translate3d(0, 0, 0);
        }

        .btn-tech-outline {
            background: var(--card-bg) !important;
            color: var(--text-muted) !important;
            border: 1px solid var(--card-border) !important;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease !important;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-tech-outline:hover {
            background: var(--card-bg-hover) !important;
            color: var(--text-primary) !important;
            border-color: var(--card-border-hover) !important;
            transform: translate3d(0, -2px, 0);
        }

        /* ===== MOBILE ===== */
        @media (max-width: 767.98px) {
            body { animation: gradient-shift 40s ease infinite; padding: 1rem !important; }
            body::before { animation: float 50s ease-in-out infinite; }
            .container { padding: 0 !important; }
            .tech-card { border-radius: 20px; padding: 20px !important; }
            .tech-card:hover { transform: none; }
            h3 { font-size: 1.3rem !important; }
            .btn-tech-primary, .btn-tech-outline { min-height: 48px; font-size: 1rem; padding: 14px 16px !important; }
            .tech-input-group { min-height: 48px; }
            .tech-form-control { font-size: 16px !important; padding: 14px !important; }
            .row.g-2 .col-8, .row.g-2 .col-4 { width: 100% !important; max-width: 100% !important; }
            button, input, select, textarea { touch-action: manipulation; }
        }
        @media (min-width: 768px) {
            .tech-card { padding: 32px !important; }
        }

        /* ===== CANVAS NỀN ĐỘNG ===== */
        #login-bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Đảm bảo content nằm trên canvas */
        .theme-toggle-btn { z-index: 1000 !important; }
        .container { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <!-- Theme Toggle Button (Fixed Position) -->
    <button onclick="toggleTheme()" class="btn btn-sm theme-toggle-btn rounded-3 d-flex align-items-center gap-2" 
            style="position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 8px 16px;"
            title="Chuyển đổi chế độ sáng/tối">
        <i id="theme-icon" class="bi bi-sun-fill"></i>
        <span id="theme-text" class="d-none d-sm-inline">Sáng</span>
    </button>
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                
                <div class="card tech-card border-0 p-3 p-sm-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-white glow-text d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-node-plus text-info"></i> GHI KHOẢN CHI MỚI
                            </h3>
                            <p class="small m-0 mt-1" style="color: #64748b;">Khởi tạo bản ghi tiêu dùng vào cơ sở dữ liệu hệ thống</p>
                        </div>
                        
                        <form th:action="@{/saveExpense}" th:object="${expense}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Nội dung chi tiêu</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-pencil-square"></i></span>
                                    <input type="text" th:field="*{title}" class="form-control tech-form-control" placeholder="Ví dụ: Mua sắm quần áo, Ăn tối..." required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Phân loại danh mục</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-tags"></i></span>
                                    <select th:field="*{category}" class="form-select tech-form-control" style="cursor: pointer;" required>
                                        <option value="" disabled selected hidden>-- Chọn phân loại phù hợp --</option>
                                        <option value="Ăn uống">🍔 Ăn uống</option>
                                        <option value="Di chuyển">🚗 Di chuyển</option>
                                        <option value="Mua sắm">🛍️ Mua sắm</option>
                                        <option value="Giải trí">🎬 Giải trí</option>
                                        <option value="Học tập">📚 Học tập</option>
                                        <option value="Hóa đơn">💵 Hóa đơn & Tiện ích</option>
                                        <option value="Khác">✨ Mục khác</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-2 tech-label">Số tiền chi tiêu (VND)</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-cash-coin"></i></span>
                                    <input type="number" step="any" th:field="*{amount}" class="form-control tech-form-control" placeholder="Nhập số tiền..." min="0" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label mb-2 tech-label">Thời gian giao dịch</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-calendar-check"></i></span>
                                    <input type="date" th:field="*{date}" class="form-control tech-form-control" required>
                                </div>
                            </div>

                            <div class="row g-2 pt-3">
                                <div class="col-8">
                                    <button type="submit" class="btn btn-tech-primary w-100 py-3 rounded-3 fw-bold">
                                        <i class="bi bi-cloud-arrow-up-fill me-1"></i> Lưu Khoản Chi
                                    </button>
                                </div>
                                <div class="col-4">
                                    <a th:href="@{/}" class="btn btn-tech-outline w-100 py-3 rounded-3 fw-semibold text-center d-block">
                                        Hủy bỏ
                                    </a>
                                </div>
                            </div>
                            
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="/js/premium-effects.js"></script>
    <script src="/js/login-bg.js"></script>
    <script src="/js/pwa.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const title = document.querySelector('input[name="title"]').value;
            const amount = document.querySelector('input[name="amount"]').value;
            const category = document.querySelector('select[name="category"]').value;
            
            // Validation
            if (!title || !amount || !category) {
                e.preventDefault();
                PremiumEffects.showToast('Vui lòng điền đầy đủ thông tin!', 'warning');
                return false;
            }
            
            if (parseFloat(amount) <= 0) {
                e.preventDefault();
                PremiumEffects.showToast('Số tiền phải lớn hơn 0!', 'warning');
                return false;
            }
            
            // Show loading and success message
            PremiumEffects.showLoading();
            PremiumEffects.showToast('Đang lưu khoản chi...', 'info');
        });
    </script>
</body>
</html>
