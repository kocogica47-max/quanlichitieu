<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Quản Lý Chi Tiêu cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/theme-variables.css" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
    
    <style>
        /* Optimized animations for 60fps */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -15px, 0); }
        }
        
        @keyframes glow-pulse-cyan {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 
                             0 0 40px rgba(6, 182, 212, 0.3); 
            }
            50% { 
                text-shadow: 0 0 30px rgba(6, 182, 212, 0.7), 
                             0 0 60px rgba(6, 182, 212, 0.4); 
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 30px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        
        body {
            background-size: 400% 400%;
            animation: gradient-shift 35s ease infinite;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            /* Optimized for smooth performance */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 40%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 30% 60%, rgba(34, 211, 238, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
            animation: float 45s ease-in-out infinite;
            pointer-events: none;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
            opacity: 0.3;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
        }

        .tech-card {
            background: rgba(30, 41, 59, 0.75) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 
                        0 8px 32px rgba(6, 182, 212, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            will-change: transform, box-shadow;
            transform: translateZ(0);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            /* GPU Acceleration */
            backface-visibility: hidden;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
            animation: float 30s ease-in-out infinite;
            pointer-events: none;
        }
        
        .tech-card:hover {
            transform: translate3d(0, -8px, 0);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7), 
                        0 12px 40px rgba(6, 182, 212, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.25),
                        0 0 0 1px rgba(6, 182, 212, 0.5);
        }

        .glow-text {
            color: #ffffff !important;
            animation: glow-pulse-cyan 3s ease-in-out infinite;
        }

        .tech-label {
            color: #cbd5e1 !important;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .tech-input-group {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.5) !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
            will-change: border-color, box-shadow;
        }
        .tech-input-group:focus-within {
            border-color: #00f5ff !important;
            box-shadow: 0 0 0 4px rgba(0, 245, 255, 0.15) !important;
        }

        .tech-input-text {
            background: transparent !important;
            border: none !important;
            color: #64748b !important;
            padding-left: 14px;
            padding-right: 8px;
        }

        .tech-form-control {
            background: transparent !important;
            border: none !important;
            color: #f8fafc !important;
            padding: 12px 14px 12px 4px;
            box-shadow: none !important;
        }
        .tech-form-control::placeholder {
            color: #475569 !important;
        }

        .btn-tech-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%) !important;
            color: #ffffff !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4), 0 0 0 1px rgba(6, 182, 212, 0.2) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            will-change: transform;
            transform: translateZ(0);
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        
        .btn-tech-cyan::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-tech-cyan:hover {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%) !important;
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5), 0 0 0 1px rgba(6, 182, 212, 0.4) !important;
        }
        
        .btn-tech-cyan:hover::before {
            left: 100%;
        }
        
        .btn-tech-cyan:active {
            transform: translate3d(0, 0, 0);
        }

        .tech-link {
            color: #06b6d4 !important;
            text-decoration: none;
            transition: color 0.15s linear !important;
        }
        .tech-link:hover {
            color: #22d3ee !important;
            text-decoration: underline;
        }
        
        /* ===== MOBILE OPTIMIZATIONS (< 768px) ===== */
        @media (max-width: 767.98px) {
            body {
                animation: gradient-shift 40s ease infinite;
                padding: 1rem !important;
            }
            
            body::before {
                animation: float 50s ease-in-out infinite;
            }
            
            .container {
                padding: 0 !important;
            }
            
            .tech-card {
                border-radius: 20px;
                padding: 20px !important;
            }
            
            .tech-card:hover {
                transform: none;
            }
            
            h2 {
                font-size: 1.4rem !important;
            }
            
            .glow-text {
                animation: none;
                text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            }
            
            .btn-tech-cyan {
                min-height: 48px;
                font-size: 1rem;
                padding: 14px 20px !important;
            }
            
            .tech-input-group {
                min-height: 48px;
            }
            
            .tech-form-control {
                font-size: 16px !important;
                padding: 14px !important;
            }
            
            button, input, select, textarea {
                touch-action: manipulation;
                -webkit-tap-highlight-color: rgba(6, 182, 212, 0.2);
            }
        }
        
        /* ===== DESKTOP OPTIMIZATIONS (>= 768px) ===== */
        @media (min-width: 768px) {
            .tech-card {
                padding: 32px !important;
            }
        }

        /* Light mode overrides for register page */
        [data-theme="light"] .tech-input-group {
            border-color: rgba(99, 102, 241, 0.2) !important;
        }

        [data-theme="light"] .tech-input-group:focus-within {
            border-color: #0891b2 !important;
            box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.12) !important;
        }

        [data-theme="light"] .tech-form-control {
            color: #0f172a !important;
        }

        [data-theme="light"] .tech-form-control::placeholder {
            color: #94a3b8 !important;
        }

        [data-theme="light"] .tech-label {
            color: #334155 !important;
        }

        [data-theme="light"] .tech-link {
            color: #0891b2 !important;
        }

        [data-theme="light"] .tech-link:hover {
            color: #0e7490 !important;
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button (Fixed Position) -->
    <button onclick="toggleTheme()" class="btn btn-sm theme-toggle-btn rounded-3 d-flex align-items-center gap-2" 
            style="position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 8px 16px;"
            title="Chuyển đổi chế độ sáng/tối">
        <i id="theme-icon" class="bi bi-sun-fill"></i>
        <span id="theme-text" class="d-none d-sm-inline">Sáng</span>
    </button>
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="card tech-card border-0 p-3 p-sm-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-white glow-text d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-person-plus-fill text-info"></i> ĐĂNG KÝ MỚI
                            </h2>
                            <p class="small m-0 mt-1" style="color: #64748b;">Khởi tạo tài khoản giám sát chi tiêu cá nhân</p>
                        </div>
                        
                        <div th:if="${param.error}" class="alert alert-warning border-0 small text-center rounded-3 mb-4" 
                             style="background: rgba(245, 158, 11, 0.15); color: #fbbf24;">
                            <i class="bi bi-exclamation-circle-fill me-1"></i> Tên tài khoản đã tồn tại trên cơ sở dữ liệu!
                        </div>

                        <form th:action="@{/register}" method="POST" class="d-flex flex-column gap-3">
                            
                            <div class="mb-2">
                                <label class="form-label mb-1.5 tech-label">Tên tài khoản</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" name="username" class="form-control tech-form-control" placeholder="Nhập tên tài khoản..." required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-1.5 tech-label">Mật khẩu</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-key-fill"></i></span>
                                    <input type="password" name="password" class="form-control tech-form-control" placeholder="Nhập mật khẩu an toàn..." required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-tech-cyan w-100 py-2.5 rounded-3 fw-bold mt-2">
                                <i class="bi bi-shield-check me-1"></i>Tạo Tài Khoản
                            </button>
                            
                            <div class="text-center mt-4 pt-2 border-top border-white border-opacity-5 small text-secondary">
                                <span style="color: #64748b;">Đã có tài khoản từ trước?</span> 
                                <a th:href="@{/login}" class="tech-link fw-semibold ms-1"><i class="bi bi-arrow-left small"></i> Quay lại Đăng nhập</a>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="/js/premium-effects.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            PremiumEffects.showToast('Tên tài khoản đã tồn tại!', 'error');
        }
        
        document.querySelector('form').addEventListener('submit', function(e) {
            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;
            
            if (username.length < 3) {
                e.preventDefault();
                PremiumEffects.showToast('Tên tài khoản phải có ít nhất 3 ký tự!', 'warning');
                return false;
            }
            
            if (password.length < 6) {
                e.preventDefault();
                PremiumEffects.showToast('Mật khẩu phải có ít nhất 6 ký tự!', 'warning');
                return false;
            }
            
            PremiumEffects.showLoading();
            PremiumEffects.showToast('Đang tạo tài khoản...', 'info');
        });
    </script>
</body>
</html>
