<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Chi Tiêu cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/theme-variables.css" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
    
    <style>
        /* Optimized animations for 60fps */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -15px, 0); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.5), 
                             0 0 40px rgba(99, 102, 241, 0.3); 
            }
            50% { 
                text-shadow: 0 0 30px rgba(99, 102, 241, 0.7), 
                             0 0 60px rgba(99, 102, 241, 0.4); 
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 30px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        
        body {
            background-size: 400% 400%;
            animation: gradient-shift 35s ease infinite;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            /* Optimized for smooth performance */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
            animation: float 45s ease-in-out infinite;
            pointer-events: none;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
            opacity: 0.3;
            /* GPU Acceleration */
            transform: translate3d(0, 0, 0);
        }

        .tech-card {
            background: var(--tech-card-bg) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--tech-card-border) !important;
            border-radius: 24px;
            box-shadow: var(--tech-card-shadow);
            will-change: transform, box-shadow;
            transform: translateZ(0);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease;
            position: relative;
            overflow: hidden;
            backface-visibility: hidden;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            animation: float 30s ease-in-out infinite;
            pointer-events: none;
        }
        
        .tech-card:hover {
            transform: translate3d(0, -6px, 0);
            box-shadow: var(--tech-card-shadow-hover);
        }

        .glow-text {
            color: var(--text-primary) !important;
            -webkit-text-fill-color: var(--text-primary);
        }
        [data-theme="dark"] .glow-text {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        .tech-label {
            color: var(--label-color) !important;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .tech-input-group {
            border: 1px solid var(--input-border) !important;
            border-radius: 12px;
            overflow: hidden;
            background: var(--input-bg) !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
        }
        .tech-input-group:focus-within {
            border-color: var(--input-border-focus) !important;
            box-shadow: 0 0 0 3px var(--input-shadow-focus) !important;
        }

        .tech-input-text {
            background: transparent !important;
            border: none !important;
            color: var(--input-icon-color) !important;
            padding-left: 14px;
            padding-right: 8px;
        }

        .tech-form-control {
            background: transparent !important;
            border: none !important;
            color: var(--input-color) !important;
            padding: 12px 14px 12px 4px;
            box-shadow: none !important;
        }
        .tech-form-control::placeholder {
            color: var(--input-placeholder) !important;
        }

        .btn-tech-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4f46e5 100%) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 4px 14px rgba(90, 127, 168, 0.3) !important;
            transition: transform 0.25s ease, box-shadow 0.25s ease !important;
            will-change: transform;
            transform: translateZ(0);
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        .btn-tech-primary:hover {
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 6px 20px rgba(90, 127, 168, 0.4) !important;
        }
        .btn-tech-primary:active {
            transform: translate3d(0, 0, 0);
        }

        /* Light mode card overrides */
        [data-theme="light"] .tech-input-group {
            border-color: var(--input-border) !important;
            background: var(--input-bg) !important;
        }
        [data-theme="light"] .tech-input-group:focus-within {
            border-color: var(--input-border-focus) !important;
            box-shadow: 0 0 0 3px var(--input-shadow-focus) !important;
        }
        [data-theme="light"] .tech-form-control {
            color: var(--input-color) !important;
        }
        [data-theme="light"] .tech-form-control::placeholder {
            color: var(--input-placeholder) !important;
        }
        [data-theme="light"] .tech-label {
            color: var(--label-color) !important;
        }
        [data-theme="light"] .tech-link {
            color: var(--accent-primary) !important;
        }
        [data-theme="light"] .tech-link:hover {
            color: var(--accent-purple) !important;
        }
        [data-theme="light"] p[style*="#64748b"] {
            color: var(--text-muted) !important;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 767.98px) {
            body { animation: gradient-shift 40s ease infinite; padding: 1rem !important; }
            body::before { animation: float 50s ease-in-out infinite; }
            .container { padding: 0 !important; }
            .tech-card { border-radius: 20px; padding: 20px !important; }
            .tech-card:hover { transform: none; }
            h2 { font-size: 1.4rem !important; }
            .btn-tech-primary { min-height: 48px; font-size: 1rem; padding: 14px 20px !important; }
            .tech-input-group { min-height: 48px; }
            .tech-form-control { font-size: 16px !important; padding: 14px !important; }
            button, input, select, textarea { touch-action: manipulation; }
        }
        @media (min-width: 768px) {
            .tech-card { padding: 32px !important; }
        }

        /* ===== CANVAS NỀN ĐỘNG ===== */
        #login-bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Đảm bảo content nằm trên canvas */
        .theme-toggle-btn { z-index: 1000 !important; }
        .container { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <!-- Theme Toggle Button (Fixed Position) -->
    <button onclick="toggleTheme()" class="btn btn-sm theme-toggle-btn rounded-3 d-flex align-items-center gap-2" 
            style="position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 8px 16px;"
            title="Chuyển đổi chế độ sáng/tối">
        <i id="theme-icon" class="bi bi-sun-fill"></i>
        <span id="theme-text" class="d-none d-sm-inline">Sáng</span>
    </button>
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="card tech-card border-0 p-3 p-sm-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-white glow-text d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-cpu text-info"></i> QUẢN LÝ CHI TIÊU
                            </h2>
                            <p class="small m-0 mt-1" style="color: #64748b;">Hệ thống xác thực tài khoản cá nhân</p>
                        </div>
                        
                        <div th:if="${param.error}" class="alert alert-danger border-0 small text-center rounded-3 mb-4" 
                             style="background: rgba(239, 68, 68, 0.15); color: #f87171;">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> Tài khoản hoặc mật khẩu không chính xác!
                        </div>

                        <form th:action="@{/login}" method="POST" class="d-flex flex-column gap-3">
                            
                            <div class="mb-2">
                                <label class="form-label mb-1.5 tech-label">Tên đăng nhập</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" name="username" class="form-control tech-form-control" placeholder="Nhập tên tài khoản..." required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label mb-1.5 tech-label">Mật khẩu</label>
                                <div class="input-group tech-input-group">
                                    <span class="input-group-text tech-input-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <input type="password" name="password" class="form-control tech-form-control" placeholder="Nhập mật khẩu bảo mật..." required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-tech-primary w-100 py-2.5 rounded-3 fw-bold mt-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                            </button>
                            
                            <div class="text-center mt-4 pt-2 border-top border-white border-opacity-5 small text-secondary">
                                <span style="color: #64748b;">Chưa có tài khoản?</span> 
                                <a th:href="@{/register}" class="tech-link fw-semibold ms-1">Đăng ký ngay <i class="bi bi-arrow-right small"></i></a>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="/js/premium-effects.js"></script>
    <script src="/js/login-bg.js"></script>
    <script>
        // Check for error parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            PremiumEffects.showToast('Tài khoản hoặc mật khẩu không chính xác!', 'error');
        }
        

    </script>
</body>
</html>
